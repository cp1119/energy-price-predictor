[project]
name = "energy-price-predictor"
version = "0.1.0"
description = "Energy price prediction using European power system data from the Rebase Grid API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "holidays>=0.108",
    "lightgbm>=4.7.0",
    "optuna>=5.0.0",
    "pandas>=2.2",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
notebooks = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[tool.uv]
default-groups = ["dev", "notebooks"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_price_predictor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls the real Rebase Grid API (needs REBASE_GRID_API_KEY)"]
